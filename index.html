<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>야채가게 포인트 적립</h1>
  <input type="text" id="name" placeholder="이름">
  <input type="text" id="phone" placeholder="전화번호">
  <button onclick="savePoint()">적립하기</button>
  
  <script>
    // 1. 여기에 본인의 Supabase 정보를 넣으세요
    const supabase = supabase.createClient(
      'https://ehdcalyhcllkgrjztots.supabase.co', 
      'sb_publishable_y75l9XHdqjqPASDZj4lmLg_-NT2Wu3r'
    );

    async function savePoint() {
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      
      // 2. Supabase의 'customers' 테이블에 데이터를 넣습니다
      const { data, error } = await supabase
        .from('customers')
        .insert([{ name: name, phone: phone, points: 100 }]);

      if (error) alert("저장 실패: " + error.message);
      else alert("적립 완료!");
    }
  </script>
</body>
</html>
