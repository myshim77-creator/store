<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>야채가게 포인트 적립</h1>
  <input type="text" id="name" placeholder="이름">
  <input type="text" id="phone" placeholder="전화번호">
  <button onclick="savePoint()">적립하기</button>
  
  <script>
    // 여기에 본인의 Supabase 정보를 넣으세요
    const supabase = supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_ANON_KEY');

    async function savePoint() {
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      
      const { data, error } = await supabase
        .from('customers')
        .insert([{ name: name, phone: phone, points: 100 }]);

      if (error) alert("저장 실패: " + error.message);
      else alert("적립 완료!");
    }
  </script>
</body>
</html>
